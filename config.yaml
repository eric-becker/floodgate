# floodgate configuration

# Zerohop: set hop_limit to 0 and let EMQX deliver the modified packet. A
# downlinking gateway shows it to its own user but never retransmits it on RF. Booleans must be unquoted: a quoted "false" is rejected.
zerohop_enabled: true

# Channels to zero-hop. Standard Meshtastic public presets.
zerohop_channels:
  - "LongTurbo"
  - "LongFast"
  - "LongModerate"
  - "MediumFast"
  - "MediumSlow"
  - "ShortFast"
  - "ShortSlow"
  - "ShortTurbo"

# What zero-hop does to hop_start (README, "How It Works"):
#   keep      — leave it as the sender set it, as mqtt.meshtastic.org does (default)
#   travelled — set it to the hops already travelled, so hop counts stay true
zerohop_hop_start: "keep"

# Drop: deny the publish entirely so EMQX never delivers it to subscribers.
# Disabled by default. Drop is checked BEFORE zerohop — a dropped packet
# never reaches the zerohop logic.
drop_enabled: false

# Channels on which the drop filter is active. Three forms accepted:
#   "zerohop_channels" — reuse the same list as zerohop_channels (default)
#   ["LongFast", ...]  — explicit list of channel names
#   null               — apply to ALL channels (no scoping)
drop_channels: "zerohop_channels"

# Portnums to drop, by exact Meshtastic proto enum name (unknown names are
# rejected at startup). See:
# https://buf.build/meshtastic/protobufs/docs/main:meshtastic#meshtastic.PortNum
# Drop only acts on packets whose portnum floodgate can read: protobuf (/e/)
# packets on channels using the default key (AQ==), and the few JSON types
# firmware labels. Keep drop_channels scoped to default-key channels -- a
# custom-keyed packet decrypted with the default key can, rarely, look like a
# matching portnum.
drop_portnums: []

grpc_port: 9000

# Size of the gRPC server thread pool. EMQX opens `pool_size` concurrent
# connections to the ExHook (EMQX's own default is 8) — set this to match or
# exceed it, or calls queue behind busy workers. A call slower than the
# broker's `request_timeout` counts as failed and EMQX delivers the message
# unmodified, whatever `failed_action` says: an undersized pool silently loses
# zero-hop protection rather than dropping packets.
grpc_max_workers: 16

health_port: 8080
topic_filter: "msh/#"
stats_interval_s: 60

# INFO logs per-message outcomes. DEBUG adds verbose internals.
log_level: "INFO"

# "text" (human-readable) or "json" (structured, for Loki/Grafana).
# Override with FLOODGATE_LOG_FORMAT env var.
log_format: "text"

# Log a periodic stats summary (zerohop/passthru/noop/dropped/skipped/errors
# counts per interval). Set false to disable stats log lines.
stats_log: true
